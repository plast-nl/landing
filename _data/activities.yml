sections:
  - id: meetings
    title: "Сходини"
    text: "Пластові сходини проводяться регулярно протягом навчального року. Їхня періодичність і місце проведення залежать від осередку."
  - id: camps
    title: "Табори та мандрівки"
    text: "Літні пластові табори — щороку влітку Пласт у Нідерландах організовує табір, під час якого учасники здобувають практичні навички, вчаться самостійності, командній роботі та життю серед природи. Табір також дає чудову можливість познайомитися, поспілкуватися й обмінятися досвідом із пластунами з інших осередків та країн."
  - id: training
    title: "Вишколи"
    text: "Вишколи допомагають здобути знання та навички для різних ролей у Пласті. Дорослі можуть долучатися до виховництва, проведення занять чи організаційної підтримки, навіть без попереднього пластового досвіду. Потрібна підготовка залежить від обраної ролі — про вступні семінари, навчання для виховників і доступні формати дізнавайся у своєму осередку."
