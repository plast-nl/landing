about:
  title: "Про нас"
  heading: "Своя спільнота. Спільні пригоди."
  body: >
    **Пласт** — це українська скаутська організація, що має понад столітню
    історію та діє більш ніж у 20 країнах світу. Наша діяльність ґрунтується
    на засадах самовиховання, християнської моралі та любові до України.


    Осередок **Пласту в Нідерландах** об'єднує українські родини та молодь,
    які хочуть зберегти рідну мову й культуру, знайти друзів і разом зростати.
    Через гру, пригоди, табори та мандрівки ми допомагаємо дітям і молоді
    ставати впевненими, відповідальними та небайдужими людьми.


    Приєднуйся до нашої спільноти — тут завжди раді новим друзям!
  section: about

services:
  title: "Наша місія"
  heading: "Характер, що зростає у дії."
  text: "Місія Пласту — сприяти всебічному патріотичному вихованню та самовдосконаленню молоді на засадах християнської моралі — виховувати свідомих, відповідальних **громадян, які вміють долати виклики, поважають свободу і є надійною опорою для місцевої та української спільнот**."
  section: mission
  list:
    - title: "Виховання характеру"
      desc: "Через скаутський метод, гутірки та спільну працю ми розвиваємо самостійність, відповідальність і лідерські якості."
    - title: "Любов до України"
      desc: "Зберігаємо українську мову, традиції та культуру, виховуємо свідомих патріотів, де б вони не жили."
    - title: "Служіння спільноті"
      desc: "Вчимося допомагати іншим, бути корисними громаді та разом творити сильне українське середовище в Нідерландах."

