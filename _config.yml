# Plast Netherlands - custom Jekyll website.
# Set baseurl to "/repository-name" only for a GitHub Pages project URL.
url: ""
baseurl: ""

title: "Українська скаутська організація в Нідерландах"
description: >-
  Пласт — Oekraïense Scouts in Nederland. Українська скаутська організація
  в Нідерландах: виховання, табори, мандрівки та українська спільнота.
lang: uk

logo:
  path: assets/img/plast-nl-logo.svg
  height: 96

markdown: kramdown

# Internal guides and tooling do not belong in the published website.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - output/
  - tmp/
