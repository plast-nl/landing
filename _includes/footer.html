{% assign c = site.data.sitetext.contact %}
<footer class="site-footer">
  <div class="shell footer-inner">
    <a href="{{ "/" | relative_url }}" class="footer-brand">Пласт <span>Нідерланди</span></a>
    <p>© {{ 'now' | date: '%Y' }} Пласт у Нідерландах</p>
    <div class="footer-actions">
      <nav class="footer-social" aria-label="Соціальні мережі та пошта">
        {% if c.facebook %}
        <a class="social-button" href="{{ c.facebook }}" target="_blank" rel="noopener" aria-label="Пласт Нідерланди у Facebook">
          {% include social-icon.html name='facebook' %}
        </a>
        {% endif %}
        {% if c.email-address %}
        <a class="social-button" href="mailto:{{ c.email-address }}" aria-label="Написати Пласту електронною поштою">
          {% include social-icon.html name='email' %}
        </a>
        {% endif %}
      </nav>
      <a class="footer-back" href="#page-top">Нагору <span aria-hidden="true">↑</span></a>
    </div>
  </div>
</footer>
