<button class="copy-button" type="button" data-copy="{{ include.value | escape }}" aria-label="{{ include.label | escape }}" title="{{ include.label | escape }}" hidden>
  <svg class="copy-symbol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false">
    <rect x="8" y="8" width="12" height="12" rx="2"/>
    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
  </svg>
  <svg class="copy-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
    <path d="m5 12 4 4L19 6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
