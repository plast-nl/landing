{% assign a = site.data.sitetext.about %}
<section class="about section-space" id="{{ a.section | default: 'about' }}" aria-labelledby="about-title">
  <div class="shell about-grid">
    <div>
      <p class="eyebrow">01 / {{ a.title }}</p>
      <h1 id="about-title">{{ a.heading }}</h1>
      <div class="about-mark" aria-hidden="true">{% include icon.html name='star' %}</div>
    </div>
    <div class="about-body">{{ a.body | markdownify }}</div>
  </div>
</section>
