{% assign s = site.data.sitetext[site.locale].services %}
<section class="mission section-space" id="{{ s.section | default: 'mission' }}" aria-labelledby="mission-title">
  <div class="shell">
    <div class="mission-intro">
      <div><p class="eyebrow">02 / {{ s.title }}</p><h2 id="mission-title">{{ s.heading }}</h2></div>
      <p>{{ s.text }}</p>
    </div>
    <div class="mission-values">
      {% for item in s.list %}
      <article class="mission-value">
        <span class="value-number" aria-hidden="true">0{{ forloop.index }}</span>
        <h3>{{ item.title }}</h3>
        <p>{{ item.desc }}</p>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
