<!-- Contact (address only) -->
{% assign t = site.data.sitetext[site.locale].contact %}
<style>
  /* Theme applies a map background to #contact; we show a plain address block instead. */
  #{{ t.section | default: "contact" }} { background-image: none !important; background-color: #fff; }
</style>
<section class="page-section" id="{{ t.section | default: "contact" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">{{ t.title | default: "Контакти" }}</h2>
        <h3 class="section-subheading text-muted">{{ t.text }}</h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 mx-auto text-center large text-muted">
        {%- if t.address -%}
        <p>
          <i class="fas fa-map-marker-alt"></i>&nbsp;
          <a href="https://www.google.com/maps/search/?api=1&query={{ t.address | url_encode }}"
            target="_blank" rel="noopener">{{ t.address }}</a>
        </p>
        {%- endif -%}
        {%- if t.email-address -%}
        <p>
          <i class="fas fa-envelope"></i>&nbsp;
          <a href="mailto:{{ t.email-address }}">{{ t.email-address }}</a>
        </p>
        {%- endif -%}
        {%- if t.facebook -%}
        <p>
          <i class="fab fa-facebook-f"></i>&nbsp;
          <a href="{{ t.facebook }}" target="_blank" rel="noopener">Facebook</a>
        </p>
        {%- endif -%}
      </div>
    </div>
  </div>
</section>
<!-- End Contact -->
